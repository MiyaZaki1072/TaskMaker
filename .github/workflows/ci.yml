name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Without this, a workflow that runs on pull_request from a fork inherits
# a broader token than it needs; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Puppeteer would otherwise download ~150 MB of Chromium that these checks never launch.
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Type-check
        run: npm run typecheck

      - name: Validate problem files
        run: npm run validate

      - name: Text rendering regression tests
        run: npm run test:text

      - name: Scoreboard (CMS ranking) tests
        run: npm run test:ranking

      - name: ZIP export/import tests
        run: npm run verify:zip

      - name: Global library tests
        run: npm run test:library

      # Auth, sessions, CSRF, upload limits and rate limiting. This is the check that matters most
      # on a public repo: the studio is meant to be reachable from the internet.
      - name: Security tests
        run: npm run verify:security

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t problem-studio:ci .

      # Regression test for a real bug: the runtime stage once omitted src/studio-public, so the
      # image built and started cleanly and then served 404s for every stylesheet and script. A
      # build that merely succeeds proves nothing — assert the files are actually in the image.
      - name: Assert runtime files are present in the image
        run: |
          for f in \
            /app/build/server.js \
            /app/src/studio-public/studio.css \
            /app/src/studio-public/dashboard.js \
            /app/src/studio-public/editor.js \
            /app/templates/render.hbs \
            /app/assets/style.css \
            /app/node_modules/katex/dist/katex.min.css
          do
            docker run --rm problem-studio:ci test -f "$f" \
              && echo "ok   $f" \
              || { echo "MISSING $f"; exit 1; }
          done

      # Chromium and the Thai fonts are what make PDF export work. Missing fonts do not crash
      # anything — they silently render every Thai character as an empty box — so check directly.
      - name: Assert Chromium and Thai fonts are installed
        run: |
          docker run --rm problem-studio:ci test -x /usr/bin/chromium \
            || { echo "chromium missing"; exit 1; }
          # Check the font files directly rather than via fc-list: fontconfig is not guaranteed to
          # be present in a slim image, and a missing tool would look identical to a missing font.
          docker run --rm problem-studio:ci \
            sh -c 'ls /usr/share/fonts/truetype/tlwg/*.ttf >/dev/null 2>&1' \
            || { echo "no Thai font in the image — PDFs would render Thai as empty boxes"; exit 1; }
          docker run --rm problem-studio:ci \
            sh -c 'ls /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf >/dev/null 2>&1' \
            || { echo "no emoji font in the image — the scoreboard's 🍦 would print as an empty box"; exit 1; }

      # The server must refuse to start unconfigured rather than serving an open studio.
      - name: Assert it refuses to start without a password
        run: |
          if docker run --rm -e DATABASE_URL=postgres://x:y@127.0.0.1:5432/z problem-studio:ci; then
            echo "started without STUDIO_PASSWORD"; exit 1
          fi
          echo "ok: refused to start without STUDIO_PASSWORD"
