# ============================================================
#  ไฟล์โจทย์ (problem.yaml)
#  วิธีใช้: แก้เฉพาะข้อความหลังเครื่องหมาย : หรือหลังเครื่องหมาย - เท่านั้น
#  ห้ามลบหัวข้อ (คำที่อยู่ซ้ายสุด เช่น story:, constraints:) ออก
#  ห้ามใช้ปุ่ม Tab เว้นวรรค ให้ใช้ปุ่ม space อย่างเดียว
#
#  พิมพ์สูตรคณิตศาสตร์ด้วยเครื่องหมาย $ ครอบ เช่น  $N$   $A_i$   $1 \le N \le 10^5$
#  ถ้าอยากได้เครื่องหมาย $ จริงๆ ให้พิมพ์ \$
# ============================================================

task:
  code: "__CODE__"            # รหัสโจทย์ ใช้ตั้งชื่อไฟล์ PDF ด้วย เช่น Example_Task
  name: "__NAME__"            # ชื่อโจทย์ที่จะแสดงบนหัวกระดาษ

# โลโก้บนหัวกระดาษ (ไม่ใส่ก็ได้ — ลบทั้งบรรทัดนี้ทิ้งได้เลย)
# ให้วางไฟล์รูปไว้ในโฟลเดอร์ assets/ ข้างๆ ไฟล์นี้
# หรือใช้รูปจากคลังกลาง (หน้า 📚 Library) ที่ทุกโจทย์ใช้ร่วมกัน โดยขึ้นต้นด้วย global/ เช่น  logo: "global/logo.png"
# logo: "assets/logo.png"

# ---------- เนื้อเรื่องของโจทย์ ----------
# พิมพ์ต่อกันไปได้เลย ระบบจัดบรรทัดให้เอง
# เว้นบรรทัดว่าง 1 ครั้ง = ขึ้นย่อหน้าใหม่
#
# วิธีใส่รูปภาพในเนื้อเรื่อง:
#   [img: assets/ชื่อไฟล์.png]
#   หรือใส่คำอธิบาย: [img: assets/ชื่อไฟล์.png | คำอธิบายภาพ]
#   หรือกำหนดขนาดด้วย: [img: assets/ชื่อไฟล์.png | คำอธิบายภาพ | 300]  (ใส่ตัวเลข = พิกเซล, หรือใส่ % เช่น 50%)
#   รูปจากคลังกลาง (หน้า 📚 Library): [img: global/ชื่อไฟล์.png]
#   (บนเว็บ Studio: เพียงพิมพ์คำว่า img จะมีเมนูขึ้นมาให้เลือกรูปได้ทันที)
#
# ตัวช่วยจัดข้อความอื่น ๆ:
#   ตัวหนา                [b]ข้อความ[/b]
#   ขึ้นบรรทัดใหม่ (ไม่ขึ้นย่อหน้าใหม่)   [br]
#   จัดกึ่งกลาง / ชิดซ้าย / ชิดขวา    [center]...[/center]   [left]...[/left]   [right]...[/right]
#   (ครอบได้ทั้งข้อความและรูปภาพ)
story: |
  เขียนเนื้อเรื่องของโจทย์ตรงนี้ เล่าสถานการณ์ให้ผู้เข้าแข่งขันเข้าใจว่าต้องทำอะไร
  ใส่ตัวแปรเป็นสูตรได้ เช่น มีของทั้งหมด $N$ ชิ้น ชิ้นที่ $i$ มีราคา $A_i$ บาท

  ย่อหน้าที่สอง อธิบายสิ่งที่ต้องหาคำตอบให้ชัดเจน

# ---------- ข้อมูลนำเข้า ----------
# อธิบายทีละบรรทัด ขึ้นต้นด้วย - แล้วเว้นวรรค 1 ครั้ง
input_format:
  - "บรรทัดที่ 1 รับจำนวนเต็ม $N$ แสดงถึง ..."
  - "บรรทัดที่ 2 รับจำนวนเต็ม $N$ จำนวน ได้แก่ $A_1, A_2, \\ldots, A_N$"

# ---------- ข้อมูลส่งออก ----------
output_format:
  - "จำนวนเต็มเพียงจำนวนเดียว แสดงถึง ..."

# ---------- เงื่อนไข (ขอบเขตของตัวแปร) ----------
constraints:
  - "$1 \\le N \\le 100{,}000$"
  - "$1 \\le A_i \\le 1{,}000{,}000$ สำหรับทุก $i$"

# ---------- ปัญหาย่อย ----------
# ระบบจะใส่เลขข้อและรวมคะแนนท้ายตารางให้เอง
# ถ้าโจทย์นี้ไม่มีปัญหาย่อย ให้เขียนว่า  subtasks: []
subtasks:
  - score: 20
    condition: "$N \\le 1{,}000$"
  - score: 30
    condition: "ไม่มีเงื่อนไขเพิ่มเติม"

# ---------- ตัวอย่าง ----------
# ระบบจะใส่คำว่า "ตัวอย่างที่ 1, 2, ..." ให้เอง
examples:
  - input: |
      3
      1 2 3
    output: "6"
    explanation: |
      อธิบายว่าทำไมคำตอบถึงเป็น 6
      - ใส่หัวข้อย่อยแบบนี้ก็ได้
    # รูปประกอบเฉพาะตัวอย่างนี้ (ไม่ใส่ก็ได้ — ลบทั้งบรรทัดทิ้งได้เลย)
    # image: "assets/example1.png"

# ---------- ข้อจำกัดในการรันโปรแกรม ----------
limits:
  time: "1 second"
  memory: "256 MiB"

# ---------- ชื่อผู้ออกโจทย์ ----------
author: "ชื่อผู้ออกโจทย์"
