task:
  code: "Example_Mirror_Range"
  name: "ช่วงสมมาตรที่ยาวที่สุด"

story: |
  นักสำรวจคนหนึ่งบันทึกระดับความสูงของพื้นที่แห่งหนึ่งเอาไว้ทุก ๆ ระยะเท่า ๆ กัน รวมทั้งสิ้น $N$ ค่า

  เขาสนใจรูปแบบที่เรียกว่า "ช่วงสมมาตร" ซึ่งหมายถึงช่วงที่อ่านจากซ้ายไปขวาแล้วได้ค่าเดิมกับการอ่านจากขวาไปซ้าย

  จงเขียนโปรแกรมหาช่วงสมมาตรที่ยาวที่สุด หากมีหลายช่วงที่ยาวเท่ากัน ให้ตอบช่วงที่อยู่ทางซ้ายมือที่สุด

input_format:
  - "บรรทัดที่ 1 รับจำนวนเต็ม $N$ แสดงถึงจำนวนค่าที่บันทึกไว้"
  - 'บรรทัดที่ 2 รับจำนวนเต็ม $N$ จำนวน ได้แก่ $a_1, a_2, \ldots, a_N$ แทนค่าที่บันทึกในตำแหน่งที่ $i$'

output_format:
  - "แสดงช่วงสมมาตรที่ยาวที่สุด"

constraints:
  - '$1 \le N \le 1{,}000$'
  - '$1 \le a_i \le 1{,}000{,}000$ สำหรับทุก $i$'

subtasks:
  - score: 2
    condition: "$N = 1$"
  - score: 8
    condition: "$a_i$ เท่ากันทุกตำแหน่ง"
  - score: 90
    condition: "ไม่มีเงื่อนไขเพิ่มเติม"

examples:
  - input: |
      4
      1 3 2 3
    output: "1"
  - input: |
      7
      7 4 5 6 5 4 1
    output: "4 5 6 5 4"

limits:
  time: "1 second"
  memory: "256 MiB"

author: "Example Author"
