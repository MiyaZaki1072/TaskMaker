task:
  code: "Example_Path_Count"
  name: "นับจำนวนขอบบนเส้นทาง"

story: |
  หุ่นยนต์สำรวจตัวหนึ่งเดินอยู่บนผังสามเหลี่ยมที่มีจุดเชื่อมต่อกันดังรูป โดยจุดหมายเลข $1$ คือจุดเริ่มต้น
  [img: assets/example-grid.png]
  ในแต่ละวันหุ่นยนต์จะออกจากจุดเริ่มต้นไปยังจุดหมายเลข $X$ แล้วเดินกลับมายังจุดเริ่มต้นอีกครั้ง โดยเลือกเส้นทางที่ข้ามขอบน้อยที่สุดเสมอ

  จงหาว่าในแต่ละวันหุ่นยนต์ต้องข้ามขอบทั้งหมดกี่ครั้ง (หากระบุ $X=1$ หมายถึงหุ่นยนต์อยู่ที่จุดเริ่มต้นอยู่แล้ว จึงไม่ต้องข้ามขอบใด ๆ)

  ตัวอย่างการเดินทางไปยังจุดหมายเลข $7$ ซึ่งต้องข้ามขอบทั้งหมด $6$ ครั้ง แสดงได้ดังรูป
  [img: assets/example-path-forward.png]
  ขาไปเดินทางจาก $1 \to 2 \to 4 \to 7$ รวม $3$ ครั้ง
  [img: assets/example-path-return.png]
  ขากลับเดินทางจาก $7 \to 4 \to 2 \to 1$ รวม $3$ ครั้ง

input_format:
  - "บรรทัดที่ $1$ รับจำนวนเต็ม $Q$ แสดงถึงจำนวนวันที่หุ่นยนต์ออกเดินทาง"
  - 'บรรทัดที่ $2$ รับจำนวนเต็ม $Q$ จำนวน ได้แก่ $X_1, X_2, \ldots, X_Q$ แสดงถึงจุดหมายในแต่ละวัน'

output_format:
  - "บรรทัดที่ $1-Q$ แสดงจำนวนขอบที่ต้องข้ามเพื่อไปยังจุดหมายเลข $X_i$ แล้วกลับมา"

constraints:
  - '$1 \le Q \le 100{,}000$'
  - '$1 \le X_i \le 100{,}000{,}000$ สำหรับทุก $i$'

subtasks:
  - score: 60
    condition: '$Q \le 1{,}000$ และ $X_i \le 10$ เสมอ'
  - score: 30
    condition: "$X_i$ เป็นจำนวนกำลังสองสมบูรณ์เสมอ"
  - score: 10
    condition: "ไม่มีเงื่อนไขเพิ่มเติม"

examples:
  - input: |
      3
      7 4 1
    output: |
      6
      4
      0
    explanation: |
      การไปยังจุดหมายเลข 7 แล้วกลับ ทำได้โดย 1->2->4->7->4->2->1 จึงตอบ 6 ครั้ง

      การไปยังจุดหมายเลข 4 แล้วกลับ ทำได้โดย 1->2->4->2->1 จึงตอบ 4 ครั้ง

      การระบุจุดหมายเลข 1 ไม่ต้องข้ามขอบใด จึงตอบ 0 ครั้ง

limits:
  time: "1 second"
  memory: "64 MiB"

author: "Example Author"
